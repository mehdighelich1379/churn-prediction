<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Churn Predictor</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: url("./image/back_ground.jpg") no-repeat center center fixed;
      background-size: cover;
      color: #e5e5e5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      backdrop-filter: blur(5px);
    }

    h1 {
      color: #00c3ff;
      font-size: 2em;
      text-shadow: 0 0 15px rgba(0, 195, 255, 0.6);
      margin-bottom: 20px;
      animation: fadeIn 1s ease-in-out;
    }

    form {
      background: rgba(28, 31, 38, 0.8);
      padding: 25px 30px;
      border-radius: 15px;
      box-shadow: 0 0 25px rgba(0, 195, 255, 0.3);
      width: 320px;
      backdrop-filter: blur(8px);
      animation: slideUp 1s ease;
    }

    input, select, button {
      width: 100%;
      margin: 10px 0;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      transition: all 0.3s ease;
    }

    input:focus, select:focus {
      box-shadow: 0 0 10px rgba(0, 195, 255, 0.6);
    }

    button {
      background-color: #00c3ff;
      color: #0e1117;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    button:hover {
      background-color: #00a3d4;
      transform: scale(1.03);
    }

    #result {
    margin-top: 40px;
    font-weight: bold;
    font-size: 20px;
    text-align: center;
    transition: all 0.4s ease;
    animation: fadeIn 0.8s ease-in-out;
    }

    .fade-in {
      animation: fadeIn 0.6s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes slideUp {
      from { transform: translateY(40px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
  </style>
</head>
<body>

  <h1>Customer Churn Prediction</h1>
  
  <form id="churnForm">
    <input type="number" id="age" placeholder="Age" required />
    <select id="gender">
      <option>Male</option>
      <option>Female</option>
    </select>
    <input type="number" id="tenure" placeholder="Tenure" required />
    <input type="number" id="usage" placeholder="Usage Frequency" required />
    <input type="number" id="calls" placeholder="Support Calls" required />
    <input type="number" id="delay" placeholder="Payment Delay" required />
    <select id="subscription">
      <option>Basic</option>
      <option>Standard</option>
      <option>Premium</option>
    </select>
    <select id="contract">
      <option>Monthly</option>
      <option>Quarterly</option>
      <option>Annual</option>
    </select>
    <input type="number" id="spend" placeholder="Total Spend" required />
    <input type="number" id="last" placeholder="Last Interaction" required />
    <button type="submit">Predict</button>
  </form>

  <div id="result"></div>

  <script>
    document.getElementById("churnForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const data = {
        Age: parseFloat(document.getElementById("age").value),
        Gender: document.getElementById("gender").value,
        Tenure: parseFloat(document.getElementById("tenure").value),
        Usage_Frequency: parseFloat(document.getElementById("usage").value),
        Support_Calls: parseFloat(document.getElementById("calls").value),
        Payment_Delay: parseFloat(document.getElementById("delay").value),
        Subscription_Type: document.getElementById("subscription").value,
        Contract_Length: document.getElementById("contract").value,
        Total_Spend: parseFloat(document.getElementById("spend").value),
        Last_Interaction: parseFloat(document.getElementById("last").value),
      };

      try {
        const response = await fetch("https://churn-prediction-production-6108.up.railway.app/predict", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data),
        });

        const resultDiv = document.getElementById("result");
        resultDiv.classList.remove("fade-in");

        if (response.ok) {
          const result = await response.json();
          const probStay = (result.churn_probability[0] * 100).toFixed(2);
          const probChurn = (result.churn_probability[1] * 100).toFixed(2);

          if (result.churn_prediction === 1) {
            resultDiv.innerHTML = `
              🚨 <span style="color:#ff3333; font-size:22px;">Customer Will Churn</span><br>
              <span style="color:#ff0000; font-weight:bold; font-size:20px; text-shadow:0 0 10px rgba(255,0,0,0.7);">
                Probability: ${probChurn}%
              </span>
            `;
          } else {
            resultDiv.innerHTML = `
              ✅ <span style="color:#00ffb3; font-size:22px;">Customer Will Stay</span><br>
              <span style="color:#00ffaa; font-weight:bold; font-size:20px; text-shadow:0 0 10px rgba(0,255,170,0.7);">
                Probability: ${probStay}%
              </span>
            `;
          }

          resultDiv.classList.add("fade-in");

        } else {
          resultDiv.innerHTML = "❌ Error: Could not connect to API.";
        }
      } catch (error) {
        console.error(error);
        document.getElementById("result").innerHTML = "⚠️ Network error or CORS issue.";
      }
    });
  </script>

</body>
</html>
